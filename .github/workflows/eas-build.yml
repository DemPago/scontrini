name: EAS Build & Submit Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build AAB e carica su Play Store (internal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build AAB (production)
        run: eas build --platform android --profile production --non-interactive

      - name: Submit al Play Store (internal track)
        if: success()
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-service-account.json
          eas submit --platform android --profile production --non-interactive
          rm google-service-account.json
