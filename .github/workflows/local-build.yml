name: Build locale AAB (senza quota EAS)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AAB su runner GitHub e carica su Play Store
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      HAS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Bump versionCode
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.android.versionCode = (cfg.expo.android.versionCode || 0) + 1;
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
            console.log('versionCode ->', cfg.expo.android.versionCode);
          "
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add app.json
          git commit -m "chore: bump android versionCode [skip ci]"
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build AAB in locale
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
        run: eas build --platform android --profile production --non-interactive --local --output "$RUNNER_TEMP/scontrini.aab"

      - name: Submit al Play Store (internal track)
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          trap 'rm -f google-service-account.json' EXIT
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json
          eas submit --platform android --profile production --non-interactive --path "$RUNNER_TEMP/scontrini.aab"
